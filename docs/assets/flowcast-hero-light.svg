<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">FlowCast — Predict Traffic Before It Happens</title>
  <desc id="d">Intelligent traffic forecasting and analytics platform. A speed chart shows observed speed up to now, the dashed forecast for the next hour, and what actually happened.</desc>
  <rect width="1280" height="400" rx="20" fill="#f6f4ef"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#e3e0d7"/>

  <g transform="translate(72 76) scale(1.625)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="#14213d" stroke="#e3e0d7"/>
    <path d="M6 19h6l4-7 3 5" fill="none" stroke="#ece7d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 17l7-6" fill="none" stroke="#76a3da" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 4.2"/>
    <circle cx="19" cy="17" r="2.6" fill="#14213d" stroke="#ece7d9" stroke-width="1.8"/>
  </g>
  <text x="140" y="111" fill="#0f1b33" font-size="26" font-weight="700" letter-spacing="5">FLOWCAST</text>
  <text x="72" y="196" fill="#0f1b33" font-size="44" font-weight="650" letter-spacing="-1">Predict traffic</text>
  <text x="72" y="248" fill="#0f1b33" font-size="44" font-weight="650" letter-spacing="-1">before it happens.</text>
  <text x="72" y="292" fill="#4f5b73" font-size="18">Intelligent traffic forecasting &amp; analytics platform</text>
  <text x="72" y="336" fill="#4f5b73" font-size="14">207 sensors · Los Angeles · 15, 30, 45 and 60 minutes ahead</text>

  <rect x="660" y="56" width="548" height="312" rx="14" fill="#ffffff" stroke="#e3e0d7"/>
  <line x1="700" x2="1160" y1="120" y2="120" stroke="#efede7"/><line x1="700" x2="1160" y1="170" y2="170" stroke="#efede7"/><line x1="700" x2="1160" y1="220" y2="220" stroke="#efede7"/><line x1="700" x2="1160" y1="270" y2="270" stroke="#efede7"/>
  <line x1="940" x2="940" y1="96" y2="290" stroke="#4f5b73" stroke-dasharray="3 4"/>
