  <polyline points="700,150 730,146 760,152 790,144 820,148 850,143 880,150 910,145 940,147" fill="none" stroke="#0f1b33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <clipPath id="reveal"><rect x="936" y="90" height="210" width="240"><animate attributeName="width" from="0" to="240" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/></rect></clipPath>
  <g clip-path="url(#reveal)">
