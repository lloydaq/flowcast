<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">FlowCast architecture</title>
  <desc id="d">Data flows from the METR-LA dataset through a canonical matrix, a leakage-tested feature pipeline, the models and their evaluation, to saved test-period forecasts served by a FastAPI backend to a React dashboard.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#4f5b73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1280" height="400" rx="20" fill="#f6f4ef"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#e3e0d7"/>
  <text x="56" y="52" fill="#4f5b73" font-size="13">Offline: data, training and evaluation</text>
  <text x="56" y="376" fill="#4f5b73" font-size="13">Serving: the forecasts the models made during evaluation, replayed against what happened</text>
  <rect x="56" y="86" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="76" y="120" fill="#0f1b33" font-size="16" font-weight="600">METR-LA dataset</text>
  <text x="76" y="144" fill="#4f5b73" font-size="12.5">207 sensors, 5-minute speeds</text>
  <text x="76" y="163" fill="#4f5b73" font-size="12.5">Mar – Jun 2012</text>
  <path d="M324 134.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="358" y="86" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="378" y="120" fill="#0f1b33" font-size="16" font-weight="600">Canonical matrix</text>
  <text x="378" y="144" fill="#4f5b73" font-size="12.5">time × sensor, Parquet</text>
  <text x="378" y="163" fill="#4f5b73" font-size="12.5">one split per timestamp</text>
  <path d="M626 134.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="86" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="680" y="120" fill="#0f1b33" font-size="16" font-weight="600">Feature pipeline</text>
  <text x="680" y="144" fill="#4f5b73" font-size="12.5">point-in-time features</text>
  <text x="680" y="163" fill="#4f5b73" font-size="12.5">leakage-tested</text>
  <path d="M928 134.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="962" y="86" width="262" height="96" rx="12" fill="#ffffff" stroke="#2f5f9e"/>
  <text x="982" y="120" fill="#0f1b33" font-size="16" font-weight="600">Models</text>
  <text x="982" y="144" fill="#4f5b73" font-size="12.5">baselines · LightGBM</text>
  <text x="982" y="163" fill="#4f5b73" font-size="12.5">DCRNN graph network</text>
  <rect x="56" y="242" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="76" y="276" fill="#0f1b33" font-size="16" font-weight="600">Evaluation</text>
  <text x="76" y="300" fill="#4f5b73" font-size="12.5">masked MAE / RMSE / MAPE</text>
  <text x="76" y="319" fill="#4f5b73" font-size="12.5">same rows, bootstrap gap</text>
  <path d="M324 290.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="358" y="242" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="378" y="276" fill="#0f1b33" font-size="16" font-weight="600">Saved forecasts</text>
  <text x="378" y="300" fill="#4f5b73" font-size="12.5">test period, every 5 min</text>
  <text x="378" y="319" fill="#4f5b73" font-size="12.5">4 horizons × 207 sensors</text>
  <path d="M626 290.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="242" width="262" height="96" rx="12" fill="#ffffff" stroke="#e3e0d7"/>
  <text x="680" y="276" fill="#0f1b33" font-size="16" font-weight="600">FastAPI</text>
  <text x="680" y="300" fill="#4f5b73" font-size="12.5">in-memory store, no database</text>
  <text x="680" y="319" fill="#4f5b73" font-size="12.5">validated, cached, typed</text>
  <path d="M928 290.0h26" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="962" y="242" width="262" height="96" rx="12" fill="#ffffff" stroke="#2f5f9e"/>
  <text x="982" y="276" fill="#0f1b33" font-size="16" font-weight="600">React dashboard</text>
  <text x="982" y="300" fill="#4f5b73" font-size="12.5">replay clock, map, charts</text>
  <text x="982" y="319" fill="#4f5b73" font-size="12.5">types from OpenAPI</text>
  <path d="M1093.0 188v24H187.0v20" fill="none" stroke="#4f5b73" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
