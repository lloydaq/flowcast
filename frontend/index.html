<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowCast: traffic speed forecasts for 207 Los Angeles highway sensors, replayed against what actually happened." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FlowCast</title>
    <script>
      // Set the theme before the first paint (same rule as src/lib/theme.ts): no flash of the wrong theme.
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t !== "dark" && t !== "light") {
          try {
            t = localStorage.getItem("flowcast-theme");
          } catch (e) {}
        }
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html { background: #f6f4ef; }
      html[data-theme="dark"] { background: #0a111f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
