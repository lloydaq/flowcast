# Continuous integration: every push and pull request.
# The data (~230 MB download) and the trained models are not in the repository, so CI runs everything
# that does not need them: lint, the synthetic unit tests (real-data tests skip themselves), the API and
# its security tests, the OpenAPI schema check, and the frontend's type-check, unit tests and builds.
# The end-to-end flows and the static demo's equivalence test need the data and run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: OpenAPI schema is in sync with the frontend's copy
        run: |
          python scripts/export_openapi.py
          git diff --ignore-all-space --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Static demo build compiles (without its data)
        run: mkdir -p .static && npx vite build --mode static --outDir dist-static
