[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcast"
version = "0.1.0"
description = "Intelligent traffic forecasting on METR-LA. Predict traffic before it happens."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires the downloaded METR-LA dataset (run scripts/prepare_metr_la.py first)"]
